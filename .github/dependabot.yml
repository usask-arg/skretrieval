version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      # Check for updates once a week
      interval: 'weekly'
    groups:
      actions:
        patterns:
          - "*"

  # Keep uv.lock fresh; CI installs with `uv sync --locked`
  - package-ecosystem: 'uv'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      python:
        patterns:
          - "*"
